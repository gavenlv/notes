version: '3.8'

services:
  # ClickHouse Database - 使用稳定版本
  clickhouse:
    image: clickhouse/clickhouse-server:23.3.11.5
    container_name: clickhouse-test
    ports:
      - "8124:8123"  # HTTP interface
      - "9001:9000"  # Native TCP interface
    environment:
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=
    volumes:
      - clickhouse-test-data:/var/lib/clickhouse
    networks:
      - monitoring-test
    restart: unless-stopped

volumes:
  clickhouse-test-data:
    driver: local

networks:
  monitoring-test:
    driver: bridge