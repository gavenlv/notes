global:
  scrape_interval: 15s
  evaluation_interval: 15s

# 告警规则配置
rule_files:
  - "clickhouse_rules.yml"

# 抓取配置
scrape_configs:
  # Prometheus自身监控
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # ClickHouse监控
  - job_name: 'clickhouse'
    static_configs:
      - targets: ['clickhouse-exporter:9333']
    scrape_interval: 30s
    scrape_timeout: 10s
    metrics_path: /metrics

  # 系统监控 (Node Exporter)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 30s

  # ClickHouse HTTP接口监控
  - job_name: 'clickhouse-http'
    metrics_path: /metrics
    static_configs:
      - targets: ['clickhouse:8123']
    scrape_interval: 30s

# 告警管理器配置 (可选)
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          # - alertmanager:9093

# 远程写入配置 (可选)
remote_write:
  # - url: http://remote-storage:8086/api/v1/prom/write

# 远程读取配置 (可选)
remote_read:
  # - url: http://remote-storage:8086/api/v1/prom/read