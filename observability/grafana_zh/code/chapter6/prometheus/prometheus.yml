global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'grafana-ha-cluster'
    environment: 'production'

# 告警规则文件
rule_files:
  - "/etc/prometheus/alert_rules.yml"

# 抓取配置
scrape_configs:
  # Prometheus自身监控
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    scrape_interval: 30s
    metrics_path: /metrics

  # Grafana实例监控
  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana-primary:3000', 'grafana-secondary:3000']
    metrics_path: /metrics
    scrape_interval: 30s
    
  # 节点监控
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 15s
    
  # Nginx监控
  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx:80']
    metrics_path: /nginx_status
    scrape_interval: 15s
    
  # MySQL监控
  - job_name: 'mysql'
    static_configs:
      - targets: ['mysql:9104']
    scrape_interval: 30s
    
  # Redis监控
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:9121']
    scrape_interval: 30s

# 远程写入配置（可选）
remote_write:
  - url: "http://remote-prometheus:9090/api/v1/write"
    queue_config:
      capacity: 2500
      max_shards: 200
      min_shards: 1
      max_samples_per_send: 500
      batch_send_deadline: 5s
      min_backoff: 30ms
      max_backoff: 100ms

# 远程读取配置（可选）
remote_read:
  - url: "http://remote-prometheus:9090/api/v1/read"
    read_recent: true

# 告警管理器配置
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093
      scheme: http
      path_prefix: /
      timeout: 10s

# 存储配置
storage:
  tsdb:
    path: /prometheus
    retention: 15d
    
# 查询日志（用于调试）
query_log:
  file: /prometheus/query.log