apiVersion: 1

datasources:
  # Prometheus数据源
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 5s
      queryTimeout: 60s
      httpMethod: POST
      manageAlerts: true
      prometheusType: Prometheus
      prometheusVersion: 2.45.0
      cacheLevel: High
      disableMetricsLookup: false
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo

  # MySQL数据源（用于性能监控）
  - name: MySQL-Performance
    type: mysql
    access: proxy
    url: mysql:3306
    database: grafana
    user: grafana
    secureJsonData:
      password: "grafana123"
    jsonData:
      maxOpenConns: 10
      maxIdleConns: 10
      connMaxLifetime: 14400
      cacheMode: "true"

  # Redis数据源（用于缓存监控）
  - name: Redis-Metrics
    type: redis-datasource
    access: proxy
    url: redis:6379
    jsonData:
      poolSize: 10
      timeout: 10
      pingInterval: 0
      pipelineWindow: 0

  # 测试数据源（用于演示）
  - name: TestData
    type: testdata
    access: proxy
    isDefault: false

  # 模拟数据源（用于负载测试）
  - name: Simulated-Data
    type: simulation
    access: proxy
    jsonData:
      streamCount: 5
      eventsPerSecond: 10
      stringLength: 20
      noise: 0.1
      drop: 0.001