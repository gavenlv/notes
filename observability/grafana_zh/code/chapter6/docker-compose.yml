version: '3.8'

services:
  # Grafana主实例
  grafana-primary:
    image: grafana/grafana:latest
    container_name: grafana-primary
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_INSTANCE_NAME=primary
      - GF_HA_PEERS=grafana-secondary:3001
      - GF_HA_CLUSTER_BIND_ADDR=0.0.0.0:3001
      - GF_DATABASE_TYPE=mysql
      - GF_DATABASE_HOST=mysql
      - GF_DATABASE_NAME=grafana
      - GF_DATABASE_USER=grafana
      - GF_DATABASE_PASSWORD=grafana123
      - GF_LOG_MODE=console
      - GF_LOG_LEVEL=info
    volumes:
      - ./provisioning/:/etc/grafana/provisioning/
      - ./plugins/:/var/lib/grafana/plugins/
      - ./dashboards/:/var/lib/grafana/dashboards/
      - grafana_data_primary:/var/lib/grafana
    depends_on:
      - mysql
      - redis
    networks:
      - grafana-network

  # Grafana备用实例
  grafana-secondary:
    image: grafana/grafana:latest
    container_name: grafana-secondary
    ports:
      - "3002:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_INSTANCE_NAME=secondary
      - GF_HA_PEERS=grafana-primary:3001
      - GF_HA_CLUSTER_BIND_ADDR=0.0.0.0:3001
      - GF_DATABASE_TYPE=mysql
      - GF_DATABASE_HOST=mysql
      - GF_DATABASE_NAME=grafana
      - GF_DATABASE_USER=grafana
      - GF_DATABASE_PASSWORD=grafana123
      - GF_LOG_MODE=console
      - GF_LOG_LEVEL=info
    volumes:
      - ./provisioning/:/etc/grafana/provisioning/
      - ./plugins/:/var/lib/grafana/plugins/
      - ./dashboards/:/var/lib/grafana/dashboards/
      - grafana_data_secondary:/var/lib/grafana
    depends_on:
      - mysql
      - redis
    networks:
      - grafana-network

  # MySQL数据库
  mysql:
    image: mysql:8.0
    container_name: mysql-chapter6
    environment:
      - MYSQL_ROOT_PASSWORD=root123
      - MYSQL_DATABASE=grafana
      - MYSQL_USER=grafana
      - MYSQL_PASSWORD=grafana123
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - grafana-network

  # Redis缓存
  redis:
    image: redis:7-alpine
    container_name: redis-chapter6
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - grafana-network

  # Nginx负载均衡器
  nginx:
    image: nginx:alpine
    container_name: nginx-chapter6
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - grafana-primary
      - grafana-secondary
    networks:
      - grafana-network

  # 监控服务
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus-chapter6
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - grafana-network

  # 节点监控
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter-chapter6
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - grafana-network

volumes:
  grafana_data_primary:
  grafana_data_secondary:
  mysql_data:
  redis_data:
  prometheus_data:

networks:
  grafana-network:
    driver: bridge