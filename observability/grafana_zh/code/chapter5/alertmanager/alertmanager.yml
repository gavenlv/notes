global:
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: 'alertmanager@your-domain.com'
  smtp_auth_username: 'your-email@gmail.com'
  smtp_auth_password: 'your-app-password'
  smtp_require_tls: true

route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'default-receiver'
  routes:
    - match:
        severity: critical
      receiver: 'critical-receiver'
      group_wait: 5s
      repeat_interval: 5m
    - match:
        severity: warning
      receiver: 'warning-receiver'
      group_wait: 30s
      repeat_interval: 30m

receivers:
  - name: 'default-receiver'
    email_configs:
      - to: 'alerts@your-domain.com'
        subject: '[AlertManager] {{ .GroupLabels.alertname }}'
        body: |
          {{ range .Alerts }}
          ========
          告警名称: {{ .Annotations.summary }}
          告警级别: {{ .Labels.severity }}
          实例: {{ .Labels.instance }}
          描述: {{ .Annotations.description }}
          开始时间: {{ .StartsAt.Format "2006-01-02 15:04:05" }}
          ========
          {{ end }}

  - name: 'critical-receiver'
    email_configs:
      - to: 'critical-alerts@your-domain.com'
        subject: '[CRITICAL] {{ .GroupLabels.alertname }}'
        body: |
          {{ range .Alerts }}
          ========
          🚨 严重告警 🚨
          告警名称: {{ .Annotations.summary }}
          告警级别: {{ .Labels.severity }}
          实例: {{ .Labels.instance }}
          描述: {{ .Annotations.description }}
          开始时间: {{ .StartsAt.Format "2006-01-02 15:04:05" }}
          ========
          {{ end }}
    webhook_configs:
      - url: 'http://webhook-server:8080/alerts'
        send_resolved: true

  - name: 'warning-receiver'
    email_configs:
      - to: 'warnings@your-domain.com'
        subject: '[Warning] {{ .GroupLabels.alertname }}'
        body: |
          {{ range .Alerts }}
          ========
          ⚠️ 警告告警 ⚠️
          告警名称: {{ .Annotations.summary }}
          告警级别: {{ .Labels.severity }}
          实例: {{ .Labels.instance }}
          描述: {{ .Annotations.description }}
          开始时间: {{ .StartsAt.Format "2006-01-02 15:04:05" }}
          ========
          {{ end }}

templates:
  - '/etc/alertmanager/templates/*.tmpl'