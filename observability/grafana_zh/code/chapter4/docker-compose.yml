version: '3.8'

services:
  grafana:
    image: grafana/grafana:latest
    container_name: grafana-chapter4
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
    volumes:
      - ./provisioning/:/etc/grafana/provisioning/
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - influxdb
      - mysql
    networks:
      - query-net

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus-chapter4
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/:/etc/prometheus/
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - query-net

  influxdb:
    image: influxdb:latest
    container_name: influxdb-chapter4
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=admin123
      - DOCKER_INFLUXDB_INIT_ORG=myorg
      - DOCKER_INFLUXDB_INIT_BUCKET=mybucket
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=mytoken
    volumes:
      - influxdb_data:/var/lib/influxdb2
    networks:
      - query-net

  mysql:
    image: mysql:8.0
    container_name: mysql-chapter4
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root123
      - MYSQL_DATABASE=query_demo
      - MYSQL_USER=grafana
      - MYSQL_PASSWORD=grafana123
    volumes:
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql_data:/var/lib/mysql
    networks:
      - query-net

  # 模拟应用，生成测试数据
  data-generator:
    image: python:3.9
    container_name: data-generator-chapter4
    volumes:
      - ./data-generator/:/app/
    working_dir: /app
    command: python generate_query_data.py
    networks:
      - query-net

volumes:
  grafana_data:
    driver: local
  prometheus_data:
    driver: local
  influxdb_data:
    driver: local
  mysql_data:
    driver: local

networks:
  query-net:
    driver: bridge