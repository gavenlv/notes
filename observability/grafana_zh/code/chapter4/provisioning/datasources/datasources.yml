apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: 15s
      httpMethod: GET
      queryTimeout: 60s
    version: 1

  - name: InfluxDB
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    editable: true
    jsonData:
      defaultBucket: mybucket
      organization: myorg
      version: Flux
      tlsSkipVerify: true
    secureJsonData:
      token: mytoken
    version: 1

  - name: MySQL
    type: mysql
    access: proxy
    url: mysql:3306
    database: query_demo
    user: grafana
    editable: true
    secureJsonData:
      password: grafana123
    jsonData:
      maxOpenConns: 10
      maxIdleConns: 10
      connMaxLifetime: 14400
    version: 1

  - name: TestData
    type: testdata
    access: proxy
    editable: true
    version: 1