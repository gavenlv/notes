# Grafana配置文件 - 第1章示例

[paths]
data = /var/lib/grafana
logs = /var/log/grafana
plugins = /var/lib/grafana/plugins
provisioning = /etc/grafana/provisioning

[server]
# 协议和端口配置
protocol = http
http_port = 3000
domain = localhost
root_url = %(protocol)s://%(domain)s:%(http_port)s/

# 启用gzip压缩
enable_gzip = true

[database]
# 使用SQLite数据库（开发环境）
type = sqlite3
path = grafana.db

[session]
# 会话配置
provider = file
provider_config = sessions
cookie_secure = false
session_life_time = 86400

[dataproxy]
# 数据代理配置
logging = true
timeout = 30
keep_alive_seconds = 30

[analytics]
# 分析数据收集
reporting_enabled = false
check_for_updates = false

[security]
# 安全配置
admin_user = admin
admin_password = admin123
secret_key = SW2YcwTIb9zpOOhoPsMm

# 允许未签名插件（开发环境）
allow_loading_unsigned_plugins = ""

[users]
# 用户配置
allow_sign_up = false
default_theme = light
auto_assign_org = true
auto_assign_org_role = Viewer

[auth.anonymous]
# 匿名访问配置
enabled = false
org_name = Main Org.
org_role = Viewer

[log]
# 日志配置
mode = console file
level = info

[log.console]
level = info

[log.file]
level = info
log_rotate = true
max_lines = 1000000
max_size_shift = 28
daily_rotate = true
max_days = 7

[alerting]
# 告警配置
enabled = true
execute_alerts = true

[panels]
# 面板配置
enable_alpha = false
disable_sanitize_html = false

[plugins]
# 插件配置
enable_alpha = false
app_tls_skip_verify_insecure = false