# models/sources.yml
# 数据源定义文件

version: 2

sources:
  - name: raw
    description: "原始数据源，包含业务系统的原始数据"
    
    # 客户相关表
    tables:
      - name: customers
        description: "客户基本信息表"
        columns:
          - name: id
            description: "客户唯一标识符"
            tests:
              - not_null
              - unique
          - name: first_name
            description: "客户名字"
          - name: last_name
            description: "客户姓氏"
          - name: email
            description: "客户邮箱地址"
            tests:
              - not_null
          - name: phone
            description: "客户电话号码"
          - name: created_at
            description: "记录创建时间"
          - name: updated_at
            description: "记录更新时间"
          - name: deleted_at
            description: "记录删除时间（软删除）"

      - name: orders
        description: "订单信息表"
        columns:
          - name: id
            description: "订单唯一标识符"
            tests:
              - not_null
              - unique
          - name: customer_id
            description: "客户ID，关联customers表"
            tests:
              - not_null
              - relationships:
                  to: source('raw', 'customers')
                  field: id
          - name: order_date
            description: "订单日期"
            tests:
              - not_null
          - name: status
            description: "订单状态（pending, completed, cancelled）"
          - name: total_amount
            description: "订单总金额"
          - name: currency
            description: "货币类型"
          - name: created_at
            description: "订单创建时间"
          - name: updated_at
            description: "订单更新时间"
          - name: deleted_at
            description: "订单删除时间"

# 测试数据源定义（用于演示）
  - name: test_data
    description: "测试数据源，包含示例数据"
    tables:
      - name: sample_customers
        description: "示例客户数据"
      - name: sample_orders
        description: "示例订单数据"