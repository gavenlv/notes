# 第7章：dbt高级特性与自定义操作
# 项目配置文件 - 演示高级配置和自定义功能

name: 'dbt_advanced_features'
version: '1.0.0'
config-version: 2

profile: 'dbt_advanced_features'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["data"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# 模型配置
models:
  dbt_advanced_features:
    # 基础配置
    +materialized: table
    +persist_docs:
      relation: true
      columns: true
    
    # 高级配置分区
    advanced:
      +tags: ["advanced", "complex-macros"]
      +materialized: table
      +post_hook:
        - "{{ log('Advanced model completed: ' ~ this.name, info=true) }}"
        - "GRANT SELECT ON {{ this }} TO analytics_team"
    
    custom_materializations:
      +tags: ["custom", "materialization"]
      +materialized: incremental
      +unique_key: id
      +on_schema_change: fail
      +incremental_strategy: merge
      +post_hook:
        - "ANALYZE {{ this }}"
        - "{{ update_run_metrics(this.name) }}"
    
    hooks:
      +tags: ["hooks", "event-handling"]
      +pre_hook:
        - "{{ log('Starting hook model: ' ~ this.name, info=true) }}"
        - "CREATE TEMPORARY TABLE IF NOT EXISTS temp_audit (model_name text, start_time timestamp)"
        - "INSERT INTO temp_audit VALUES ('{{ this.name }}', CURRENT_TIMESTAMP)"
      +post_hook:
        - "{{ log('Hook model completed: ' ~ this.name, info=true) }}"
        - "UPDATE temp_audit SET end_time = CURRENT_TIMESTAMP WHERE model_name = '{{ this.name }}'"
    
    # 性能优化配置
    performance_optimized:
      +tags: ["performance", "optimized"]
      +materialized: table
      +persist_docs: false  # 性能考虑，关闭文档持久化
      +post_hook:
        - "CREATE INDEX IF NOT EXISTS idx_perf_{{ this.name }}_id ON {{ this }} (id)"
        - "CREATE INDEX IF NOT EXISTS idx_perf_{{ this.name }}_timestamp ON {{ this }} (timestamp)"
    
    # 安全相关配置
    secure_models:
      +tags: ["secure", "sensitive-data"]
      +materialized: table
      +secure: true
      +post_hook:
        - "{{ apply_data_masking(this) }}"
        - "{{ enable_row_level_security(this) }}"

# 种子数据配置
seeds:
  dbt_advanced_features:
    +enabled: true
    +quote_columns: true
    +column_types:
      id: bigint
      created_at: timestamp
      updated_at: timestamp

# 快照配置
snapshots:
  dbt_advanced_features:
    +enabled: true
    +target_schema: snapshots
    +unique_key: id
    +strategy: timestamp
    +updated_at: updated_at
    +invalidate_hard_deletes: true

# 测试配置
tests:
  dbt_advanced_features:
    +enabled: true
    +severity: warn  # 默认警告级别，可覆盖
    
    # 自定义测试配置
    custom_tests:
      +tags: ["custom", "advanced-testing"]
      +severity: error
    
    integration:
      +tags: ["integration", "end-to-end"]
      +severity: error

# 变量定义
vars:
  # 业务变量
  default_fiscal_start_month: 4
  data_retention_days: 90
  high_value_threshold: 1000
  
  # 技术变量
  max_threads: 8
  query_timeout: 3600
  batch_size: 10000
  
  # 环境特定变量
  dev:
    debug_mode: true
    log_level: debug
  
  prod:
    debug_mode: false
    log_level: info
    max_threads: 4  # 生产环境限制并发

# 查询标签配置（数据库特定）
query-comment:
  comment: "dbt_advanced_features - {{ target.name }} - {{ invocation_id }}"
  
  # Snowflake特定标签
  snowflake:
    tags:
      department: "analytics"
      project: "dbt_advanced_features"
      environment: "{{ target.name }}"
  
  # BigQuery特定标签
  bigquery:
    labels:
      department: analytics
      project: dbt_advanced_features
      environment: "{{ target.name }}"

# 宏配置
macro-paths: ["macros"]

# 路径配置（高级特性）
source-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["data"]
snapshot-paths: ["snapshots"]
target-path: "target"
log-path: "logs"

# 包依赖配置（通过packages.yml管理）

# 环境特定配置
require-dbt-version: ">=1.0.0 <2.0.0"

# 模型选择与排除（高级用法）
select:
  - "tag:advanced"
  - "tag:custom"
  - "tag:hooks"

exclude:
  - "tag:deprecated"
  - "tag:experimental"

# 钩子配置（项目级）
on-run-start:
  - "{{ log('Starting dbt advanced features run', info=true) }}"
  - "CREATE SCHEMA IF NOT EXISTS {{ target.schema }}"
  - "{{ create_audit_table() }}"
  - "{{ initialize_performance_monitoring() }}"

on-run-end:
  - "{{ log('dbt advanced features run completed', info=true) }}"
  - "{{ update_run_summary() }}"
  - "{{ cleanup_temp_resources() }}"
  - "{{ send_notification('Run completed successfully') }}"

# 文档配置
docs:
  show:
    dbt_advanced_features:
      +include_docs: true
      +include_tests: true
      +include_sources: true
  
  # 自定义文档配置
  custom_docs:
    +business_glossary: true
    +data_lineage: true
    +change_log: true

# 性能优化配置
performance:
  # 查询优化
  +use_parallel: true
  +max_query_size: 1000000
  
  # 内存优化
  +memory_limit: "2GB"
  +temp_table_retention: "1 day"
  
  # 并发控制
  +threads: "{{ var('max_threads', 4) }}"
  +timeout: "{{ var('query_timeout', 3600) }}"

# 安全配置
security:
  # 数据保护
  +mask_sensitive_data: true
  +encrypt_at_rest: true
  
  # 访问控制
  +row_level_security: true
  +column_level_security: true
  
  # 审计日志
  +audit_logging: true
  +data_lineage_tracking: true

# 监控配置
monitoring:
  # 运行监控
  +track_execution_time: true
  +track_resource_usage: true
  +alert_on_failure: true
  
  # 数据质量监控
  +data_quality_checks: true
  +anomaly_detection: true
  
  # 性能监控
  +query_performance: true
  +resource_utilization: true

# 部署配置
deployment:
  # 环境配置
  +environment_specific_config: true
  +rollback_strategy: "automated"
  
  # 版本控制
  +versioning: true
  +change_management: true
  
  # 发布管理
  +release_notes: true
  +quality_gates: true

# 配置验证规则
# 确保配置符合最佳实践
_
  # 必需配置检查
  required_configs:
    - name
    - version
    - profile
  
  # 版本兼容性检查
  version_compatibility:
    min_dbt_version: "1.0.0"
    max_dbt_version: "2.0.0"
  
  # 安全配置检查
  security_checks:
    - sensitive_data_masking
    - access_controls
    - audit_logging
  
  # 性能配置检查
  performance_checks:
    - query_optimization
    - resource_management
    - concurrency_control

# 配置说明文档
_comment: |
  此配置文件演示dbt高级特性和自定义操作的最佳实践配置。
  包括：复杂模型配置、钩子函数、性能优化、安全设置、监控配置等。
  
  关键特性：
  1. 分层模型配置策略
  2. 高级钩子函数实现
  3. 性能优化配置
  4. 安全最佳实践
  5. 监控和可观测性
  6. 部署和版本管理
  
  使用建议：
  1. 根据实际环境调整变量值
  2. 定期审查安全配置
  3. 监控性能指标并优化
  4. 保持配置的版本控制
  5. 文档化配置变更