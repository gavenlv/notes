# 数据源定义文件 - 第5章：数据源与连接配置
version: 2

# 原始业务数据源
- name: raw_data
  description: "原始业务数据源，包含客户、订单等核心业务表"
  database: "{{ target.database }}"
  schema: raw
  
  # 数据新鲜度配置
  freshness:
    warn_after: {count: 24, period: hour}
    error_after: {count: 48, period: hour}
  
  # 数据源级元数据
  meta:
    version: "1.0.0"
    owner: "data_engineering"
    source_system: "ERP系统"
    ingestion_method: "批量ETL"
    update_frequency: "每日"
    
  # 数据源级测试
  tests:
    - dbt_utils.recency:
        datepart: day
        field: _etl_loaded_at
        interval: 2
  
  # 客户表
  tables:
    - name: customers
      description: "客户基本信息表，包含客户注册和基本信息"
      loaded_at_field: updated_at
      
      # 表级元数据
      meta:
        business_owner: "销售团队"
        pii_level: "高"
        retention_policy: "永久保留"
        
      # 表级测试
      tests:
        - dbt_utils.equal_rowcount:
            compare_model: ref('stg_customers')
        - dbt_utils.recency:
            datepart: hour
            field: updated_at
            interval: 24
      
      # 字段定义
      columns:
        - name: customer_id
          description: "客户唯一标识符，系统生成"
          data_type: varchar
          tests:
            - not_null
            - unique
            - dbt_utils.not_null_proportion:
                threshold: 0.99
          meta:
            pii: false
            business_key: true
            
        - name: first_name
          description: "客户名字"
          data_type: varchar
          tests:
            - not_null
            - dbt_utils.string_length:
                min_length: 1
                max_length: 50
          meta:
            pii: true
            
        - name: last_name
          description: "客户姓氏"
          data_type: varchar
          tests:
            - not_null
            - dbt_utils.string_length:
                min_length: 1
                max_length: 50
          meta:
            pii: true
            
        - name: email
          description: "客户邮箱地址"
          data_type: varchar
          tests:
            - not_null
            - dbt_utils.email_address
            - dbt_utils.string_length:
                min_length: 5
                max_length: 100
          meta:
            pii: true
            contact_info: true
            
        - name: phone_number
          description: "客户电话号码"
          data_type: varchar
          tests:
            - dbt_utils.phone_number
          meta:
            pii: true
            contact_info: true
            
        - name: created_at
          description: "客户创建时间"
          data_type: timestamp
          tests:
            - not_null
            - dbt_utils.accepted_range:
                min_value: '2020-01-01'
                max_value: '2023-12-31'
          meta:
            timestamp_field: true
            
        - name: updated_at
          description: "最后更新时间"
          data_type: timestamp
          tests:
            - not_null
          meta:
            timestamp_field: true
            loaded_at_field: true

    # 订单表
    - name: orders
      description: "订单信息表，记录客户购买行为"
      loaded_at_field: order_date
      
      meta:
        business_owner: "运营团队"
        pii_level: "中"
        retention_policy: "3年"
        
      tests:
        - dbt_utils.recency:
            datepart: day
            field: order_date
            interval: 7
        - dbt_utils.accepted_range:
            field: total_amount
            min_value: 0
            max_value: 100000
            
      columns:
        - name: order_id
          description: "订单唯一标识符"
          data_type: varchar
          tests:
            - not_null
            - unique
          meta:
            business_key: true
            
        - name: customer_id
          description: "客户ID，关联客户表"
          data_type: varchar
          tests:
            - not_null
            - relationships:
                to: ref('stg_customers')
                field: customer_id
          meta:
            foreign_key: true
            
        - name: order_date
          description: "订单创建日期"
          data_type: date
          tests:
            - not_null
            - dbt_utils.accepted_range:
                min_value: '2020-01-01'
                max_value: '2023-12-31'
          meta:
            date_field: true
            
        - name: total_amount
          description: "订单总金额（含税）"
          data_type: decimal(10,2)
          tests:
            - not_null
            - dbt_utils.accepted_range:
                min_value: 0
                max_value: 100000
          meta:
            monetary_field: true
            
        - name: status
          description: "订单状态"
          data_type: varchar
          tests:
            - not_null
            - dbt_utils.accepted_values:
                values: ['pending', 'processing', 'shipped', 'delivered', 'cancelled', 'refunded']
          meta:
            status_field: true

# 外部系统数据源
- name: external_system
  description: "外部系统数据源，包含产品目录等外部数据"
  database: external_db
  schema: external
  
  meta:
    version: "1.0.0"
    owner: "数据集成团队"
    source_system: "产品管理系统"
    ingestion_method: "API同步"
    update_frequency: "实时"
    
  tables:
    - name: product_catalog
      description: "产品目录信息，包含产品基本属性和分类"
      loaded_at_field: last_updated
      
      meta:
        business_owner: "产品团队"
        pii_level: "无"
        retention_policy: "永久保留"
        
      columns:
        - name: product_id
          description: "产品唯一标识符"
          data_type: varchar
          tests:
            - not_null
            - unique
          meta:
            business_key: true
            
        - name: product_name
          description: "产品名称"
          data_type: varchar
          tests:
            - not_null
            - dbt_utils.string_length:
                min_length: 1
                max_length: 100
          meta:
            descriptive_field: true
            
        - name: category
          description: "产品分类"
          data_type: varchar
          tests:
            - not_null
            - dbt_utils.accepted_values:
                values: ['electronics', 'clothing', 'home', 'sports', 'books']
          meta:
            categorical_field: true
            
        - name: price
          description: "产品价格"
          data_type: decimal(10,2)
          tests:
            - not_null
            - dbt_utils.accepted_range:
                min_value: 0
                max_value: 10000
          meta:
            monetary_field: true
            
        - name: last_updated
          description: "最后更新时间"
          data_type: timestamp
          tests:
            - not_null
          meta:
            timestamp_field: true
            loaded_at_field: true

# 日志数据源
- name: log_data
  description: "应用程序日志数据，用于行为分析和监控"
  database: "{{ target.database }}"
  schema: logs
  
  meta:
    version: "1.0.0"
    owner: "数据平台团队"
    source_system: "应用程序"
    ingestion_method: "流式处理"
    update_frequency: "实时"
    
  freshness:
    warn_after: {count: 1, period: hour}
    error_after: {count: 4, period: hour}
    
  tables:
    - name: user_activity
      description: "用户活动日志，记录用户操作和行为"
      loaded_at_field: event_timestamp
      
      meta:
        business_owner: "产品分析团队"
        pii_level: "中"
        retention_policy: "1年"
        
      columns:
        - name: event_id
          description: "事件唯一标识符"
          data_type: varchar
          tests:
            - not_null
            - unique
            
        - name: user_id
          description: "用户ID"
          data_type: varchar
          tests:
            - not_null
            
        - name: event_type
          description: "事件类型"
          data_type: varchar
          tests:
            - not_null
            - dbt_utils.accepted_values:
                values: ['page_view', 'click', 'purchase', 'login', 'logout']
                
        - name: event_timestamp
          description: "事件发生时间"
          data_type: timestamp
          tests:
            - not_null

# 配置数据源
- name: config_data
  description: "配置数据源，包含业务规则和配置信息"
  database: "{{ target.database }}"
  schema: config
  
  meta:
    version: "1.0.0"
    owner: "业务团队"
    source_system: "配置管理系统"
    ingestion_method: "手动更新"
    update_frequency: "按需"
    
  tables:
    - name: business_rules
      description: "业务规则配置表"
      
      columns:
        - name: rule_id
          description: "规则ID"
          data_type: varchar
          tests:
            - not_null
            - unique
            
        - name: rule_name
          description: "规则名称"
          data_type: varchar
          tests:
            - not_null
            
        - name: rule_value
          description: "规则值"
          data_type: varchar
          tests:
            - not_null

# 数据源依赖关系声明
# 注意：以下依赖关系需要在dbt_project.yml中配置
# depends_on:
#   - source('raw_data', 'customers')
#   - source('external_system', 'product_catalog')